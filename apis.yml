name: Deserve
description: 'Deserve was a mobile-first, cloud-native credit card platform and issuer processor
  that let regional banks, credit unions, and B2B companies launch and embed consumer, small-business,
  and commercial co-branded credit and charge cards via APIs and SDKs, with configurable modules
  for origination, underwriting, rewards, credit policy, and fraud. Founded as SelfScore and backed
  by Accel, Goldman Sachs, Mastercard, and Visa, the company was acquired by Intuit in April 2025,
  which took its core technology assets and select team members. As of 2026 the public deserve.com
  site serves only a "Launching Soon" placeholder and Deserve publishes no live developer portal,
  API reference, or documentation. This profile captures the residual public surface for the API
  Evangelist network.'
